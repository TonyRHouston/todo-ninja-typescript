name: Publish NPM
on:
  workflow_dispatch: {}
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      run: 'yarn install

        '
    - name: Publish to NPM
      run: "if [ -n \"${{ github.event.inputs.path }}\" ]; then\n  PATHS_RELEASED='[\\\
        \"${{ github.event.inputs.path }}\\\"]'\nelse\n  PATHS_RELEASED='[\\\".\\\"\
        , \\\"packages/mcp-server\\\"]'\nfi\nyarn tsn scripts/publish-packages.ts\
        \ \"{ \\\"paths_released\\\": \\\"$PATHS_RELEASED\\\" }\"\n"
      env:
        NPM_TOKEN: ${{ secrets.TODO_NINJA_NPM_TOKEN || secrets.NPM_TOKEN }}
    - name: Upload MCP Server DXT GitHub release asset
      run: "gh release upload ${{ github.event.release.tag_name }} \\\n  packages/mcp-server/todo_ninja_api.mcpb\n"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
